<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 824" width="800" height="824" role="img" aria-label="Stylized UN logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#1b1b1b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="824" fill="url(#bg)"/>

  <!-- White-outline underlay for crisp border -->
  <g transform="translate(0,6)">
    <text
      x="210"
      y="570"
      font-family="Arial Black, Impact, sans-serif"
      font-size="390"
      font-style="italic"
      font-weight="900"
      letter-spacing="-18"
      fill="none"
      stroke="#ffffff"
      stroke-width="24"
      stroke-linejoin="round"
      paint-order="stroke fill"
    >UN</text>
  </g>

  <!-- Colored letters -->
  <text
    x="210"
    y="570"
    font-family="Arial Black, Impact, sans-serif"
    font-size="390"
    font-style="italic"
    font-weight="900"
    fill="#1f63cc"
    letter-spacing="-18"
  >U</text>

  <text
    x="390"
    y="570"
    font-family="Arial Black, Impact, sans-serif"
    font-size="390"
    font-style="italic"
    font-weight="900"
    fill="#e0113a"
    letter-spacing="-18"
  >N</text>
</svg>
